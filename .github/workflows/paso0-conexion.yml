name: Paso 0 - prueba de conexión

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conexion:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Consultar El Peruano desde el runner
        run: python scripts/paso0_conexion.py
