# Reglas del monitor de normas de El Peruano.
# Todo se compara sin tildes ni mayúsculas, así que puedes escribir con o sin ellas.
# Después de editar, corre:  python -m pytest   (y una prueba con --dry-run).

# --- 1. Prioridad institucional -------------------------------------------
# Las normas de estas entidades van siempre en la primera sección del correo.
entidades_prioritarias:
  - PRESIDENCIA DEL CONSEJO DE MINISTROS
  - ECONOMÍA Y FINANZAS

# --- Filtro de municipalidades --------------------------------------------
municipalidades:
  prefijo: MUNICIPALIDAD          # se excluye toda entidad que empiece así
  excepciones:                    # ...salvo estas (nombre exacto de la entidad)
    - MUNICIPALIDAD METROPOLITANA DE LIMA

# --- 3. Prioridad alta ----------------------------------------------------
alta:
  tipos:                          # tipo de norma (lo que va antes de "N°")
    - LEY
    - RESOLUCIÓN LEGISLATIVA
    - DECRETO LEGISLATIVO
    - DECRETO DE URGENCIA
    - RESOLUCIÓN SUPREMA
  patrones:                       # expresiones regulares sobre título + sumilla
    - 'ESTADO DE EMERGENCIA'
    - 'DECLARA\w* .*EMERGENCIA'

# --- 5. Prioridad baja (se agrupa por entidad) ----------------------------
baja:
  patrones:                       # expresiones regulares sobre la sumilla
    - '\bDESIGNA(N|R|CION|CIONES)?\b'
    - '\bRENUNCIA(S)?\b'
    - '\bENCARGA(N|R|TURA)?\b'
    - '\bENCARGO(S)?\b'
    - 'AUTORIZA(N)? (EL )?VIAJE'
  entidades:                      # todo lo que emitan estas entidades es baja
    - JURADO NACIONAL DE ELECCIONES
  # Orden de evaluación. La regla general es alta -> media -> baja, pero una
  # Resolución Ministerial que solo designa a alguien es media por tipo y baja
  # por contenido. Con "true", el contenido (baja) gana sobre el tipo.
  gana_sobre_media: true          # RM/DS de designación o viaje -> baja
  gana_sobre_alta: false          # Resolución Suprema de designación -> sigue en alta

# --- 4. Prioridad media ---------------------------------------------------
# Decretos supremos y resoluciones ministeriales de otros sectores, gobiernos
# regionales y resoluciones de organismos reguladores o autónomos. Es también
# la prioridad de cualquier norma que no encaje en alta ni en baja.
media:
  tipos:
    - DECRETO SUPREMO
    - RESOLUCIÓN MINISTERIAL
  prefijos_entidad:
    - GOBIERNO REGIONAL
prioridad_por_defecto: media      # media o baja

# --- Criterio de concentración --------------------------------------------
concentracion:
  umbral: 5                       # se reporta si una entidad emite MÁS de este número en un día

# --- Modo novedades (12:00 y 15:30) ---------------------------------------
novedades:
  enviar_sin_novedades: false     # true = manda correo aunque no haya normas nuevas

# --- Revisión detallada ---------------------------------------------------
# Por defecto el correo muestra solo el título y la sumilla del listado, sin
# abrir la página de cada norma. Solo en estos casos se abre la página, se lee
# el texto completo y Claude lo resume: (a) todas las normas de PCM y MEF, y
# (b) las designaciones, renuncias, encargos y viajes de ministerios, organismos
# constitucionalmente autónomos y organismos reguladores.
revision_detallada:
  entidades_prioritarias: true    # todas las normas de PCM y MEF
  patrones:                       # designaciones, renuncias, encargos y viajes (sobre la sumilla)
    - '\bDESIGNA(N|R|CION|CIONES)?\b'
    - '\bRENUNCIA(S)?\b'
    - '\bENCARGA(N|R|TURA)?\b'
    - '\bENCARGO(S)?\b'
    - 'AUTORIZA(N)? (EL )?VIAJE'
  # Las designaciones y viajes solo se revisan a detalle en estos tres grupos.
  # En universidades, gobiernos regionales, organismos adscritos y el resto se
  # muestra únicamente el título y la sumilla.
  # Los nombres deben ser los que usa El Peruano como encabezado de la norma.
  designaciones_y_viajes:
    # 1) Ministerios. El Peruano agrupa bajo el nombre del sector también a sus
    #    organismos adscritos (p. ej. CENEPRED bajo DEFENSA, IMARPE bajo PRODUCE),
    #    así que además se exige que el tipo de norma sea del propio ministerio.
    ministerios:
      - PRESIDENCIA DEL CONSEJO DE MINISTROS
      - AMBIENTE
      - COMERCIO EXTERIOR Y TURISMO
      - CULTURA
      - DEFENSA
      - DESARROLLO AGRARIO Y RIEGO
      - DESARROLLO E INCLUSIÓN SOCIAL
      - ECONOMÍA Y FINANZAS
      - EDUCACIÓN
      - ENERGÍA Y MINAS
      - INTERIOR
      - JUSTICIA Y DERECHOS HUMANOS
      - MUJER Y POBLACIONES VULNERABLES      # nombre no observado aún en el listado
      - PRODUCE
      - RELACIONES EXTERIORES
      - SALUD
      - TRABAJO Y PROMOCIÓN DEL EMPLEO
      - TRANSPORTES Y COMUNICACIONES
      - VIVIENDA, CONSTRUCCIÓN Y SANEAMIENTO
    tipos_de_ministerio:
      - RESOLUCIÓN MINISTERIAL
      - RESOLUCIÓN SUPREMA
      - DECRETO SUPREMO
      - RESOLUCIÓN VICE MINISTERIAL
      - RESOLUCIÓN VICEMINISTERIAL
      - RESOLUCIÓN DE SECRETARÍA GENERAL
    # 2) Organismos constitucionalmente autónomos (cualquier tipo de norma).
    autonomos:
      - BANCO CENTRAL DE RESERVA
      - CONTRALORÍA GENERAL DE LA REPÚBLICA
      - DEFENSORÍA DEL PUEBLO
      - JUNTA NACIONAL DE JUSTICIA           # nombre no observado aún en el listado
      - JURADO NACIONAL DE ELECCIONES
      - MINISTERIO PÚBLICO
      - OFICINA NACIONAL DE PROCESOS ELECTORALES
      - REGISTRO NACIONAL DE IDENTIFICACIÓN Y ESTADO CIVIL
      - SUPERINTENDENCIA DE BANCA, SEGUROS Y ADMINISTRADORAS PRIVADAS DE FONDOS DE PENSIONES
      - TRIBUNAL CONSTITUCIONAL
    # 3) Organismos reguladores (cualquier tipo de norma).
    reguladores:
      - ORGANISMO SUPERVISOR DE LA INVERSIÓN EN ENERGÍA Y MINERÍA
      - ORGANISMO SUPERVISOR DE INVERSIÓN PRIVADA EN TELECOMUNICACIONES
      - ORGANISMO SUPERVISOR DE LA INVERSIÓN EN INFRAESTRUCTURA DE TRANSPORTE DE USO PÚBLICO
      - SUPERINTENDENCIA NACIONAL DE SERVICIOS DE SANEAMIENTO
  max_textos_por_ejecucion: 40    # tope de páginas abiertas por ejecución
  pausa_entre_textos_segundos: 1.0

# --- Resumen agregado (sin abrir páginas) ---------------------------------
# Normas rutinarias que no se listan una por una: se cuentan por acción y por
# distrito fiscal usando solo la sumilla del listado.
resumen_agregado:
  - entidad: MINISTERIO PÚBLICO
    etiqueta: Fiscales
    patron: '\bFISCAL(ES)?\b'     # sobre la sumilla

# --- Resúmenes con Claude -------------------------------------------------
resumenes:
  normas_por_llamada: 6           # normas agrupadas en cada llamada a Claude
  max_caracteres_por_norma: 20000 # si el texto es más largo se corta y se avisa en el resumen

# --- Estado ---------------------------------------------------------------
estado:
  dias_a_conservar: 10
